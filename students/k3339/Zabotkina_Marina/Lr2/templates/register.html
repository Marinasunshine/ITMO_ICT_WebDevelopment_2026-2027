<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — RESTO</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f6f2; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 15px; }
        .auth-card { background: #ffffff; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid #e8e4dc; max-width: 600px; width: 100%; padding: 45px; }
        .auth-card input, .auth-card select { background-color: #f2eee9; border: 1.5px solid transparent; border-radius: 12px; padding: 12px 16px; width: 100%; font-size: 0.95rem; margin-bottom: 12px; transition: 0.2s; }
        .auth-card input:focus { background-color: #fff; border-color: #354236; outline: none; }
        .auth-card label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #354236; margin-bottom: 6px; display: block; }
        .auth-card .helptext { font-size: 0.75rem; color: #787d77; display: block; margin-bottom: 10px; margin-top: -8px; }
        .btn-reserve { background-color: #354236; color: #ffffff; border: none; border-radius: 14px; padding: 16px; font-weight: 600; width: 100%; transition: 0.25s; margin-top: 20px; }
        .btn-reserve:hover { background-color: #263127; color: #ffffff; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="text-center mb-4">
        <div class="fw-bold" style="font-size: 1.5rem; letter-spacing: 6px; color: #354236;">RESTO</div>
        <div class="small text-muted mt-2">Регистрация в сервисе бронирования</div>
    </div>

    {% if form.errors %}
        <div class="alert alert-danger border-0 rounded-3 small py-2 mb-3">Пожалуйста, проверьте правильность заполнения полей и сложность пароля.</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="row">
            {% for field in form %}
                <div class="col-md-6 mb-2">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small mt-1" style="margin-top: -10px; margin-bottom: 10px;">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn-reserve">Создать профиль</button>
        <div class="text-center mt-3 small">
            Уже являетесь гостем? <a href="/login/" class="fw-bold text-decoration-none" style="color: #354236;">Войти</a>
        </div>
    </form>
</div>
</body>
</html>
