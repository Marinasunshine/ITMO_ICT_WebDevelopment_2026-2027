<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в профиль — RESTO</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f6f2; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-card { background: #ffffff; border-radius: 24px; padding: 45px; max-width: 440px; width: 100%; border: 1px solid #e8e4dc; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .login-card input { background: #f2eee9; border: 1.5px solid transparent; border-radius: 12px; padding: 12px 16px; width: 100%; margin-bottom: 16px; font-size: 0.95rem; }
        .login-card input:focus { background-color: #fff; border-color: #354236; outline: none; }
        .login-card label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #354236; margin-bottom: 6px; display: block; }
        .btn-reserve { background-color: #354236; color: #ffffff; border-radius: 12px; font-weight: 600; padding: 14px; width: 100%; border: none; }
        .btn-reserve:hover { background-color: #263127; color: #fff; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-4">
        <div class="fw-bold" style="font-size: 1.5rem; letter-spacing: 6px; color: #354236;">RESTO</div>
        <div class="small text-muted mt-2">Вход в персональный кабинет гостя</div>
    </div>
    <form method="POST">
        {% csrf_token %}
        {% if form.errors %}
            <div class="alert alert-danger border-0 rounded-3 small py-2 mb-3">Логин или пароль введены неверно.</div>
        {% endif %}

        <label>Имя пользователя</label>
        <input type="text" name="username" required>

        <label>Пароль</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn-reserve mt-2">Войти</button>
    </form>
    <div class="text-center mt-4 small text-muted">
        Впервые в резиденции? <a href="/register/" class="text-dark fw-bold text-decoration-none">Создать профиль</a>
    </div>
</div>
</body>
</html>
