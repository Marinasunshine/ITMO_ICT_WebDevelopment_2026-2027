{% extends 'base.html' %}
{% block title %}Отмена бронирования — RESTO{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card-custom p-5 text-center">
            <h3 class="fw-bold mb-2">Отмена бронирования</h3>
            <p class="text-muted">Вы уверены, что хотите отменить бронирование в отеле <b>{{ object.room.hotel.name }}</b>?</p>
            <form method="POST" class="d-flex justify-content-center gap-2 mt-4">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4 rounded-pill">Да, отменить</button>
                <a href="/my-bookings/" class="btn btn-light border px-4 rounded-pill">Назад</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
